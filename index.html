<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YAĞMUR</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --sky-top: #a8d8ff;
    --sky-mid: #87ceeb;
    --accent: #38bdf8;
    --text: #0f172a;
    --text-dim: #334155;
    --glass: rgba(255, 255, 255, 0.45);
    --glass-border: rgba(255, 255, 255, 0.7);
  }

  html, body {
    height: 100%;
    background: url("https://images.unsplash.com/photo-1490750967868-88aa4486c946?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80") center center / cover no-repeat fixed;
    color: var(--text);
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow-x: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 1rem 0.5rem;
    position: relative;
  }

  /* Rain layer */
  #rain {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    overflow: hidden;
  }
  .drop {
    position: absolute;
    top: -20px;
    width: 2px;
    height: 22px;
    background: linear-gradient(to bottom, rgba(255,255,255,0.0), rgba(56,189,248,0.85));
    border-radius: 2px;
    animation: fall linear infinite;
  }
  @keyframes fall {
    to {
      transform: translateY(110vh);
    }
  }

  /* Dark overlay for readability over photo */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,0.15), rgba(0,0,0,0.35));
    pointer-events: none;
    z-index: 0;
  }
  .word-wrapper, #poem-box { position: relative; z-index: 10; }

  /* Word wrapper */
  .word-wrapper {
    width: 100%;
    max-width: 100vw;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 0.8rem;
    margin-bottom: 3.5rem;
    flex-wrap: wrap;
    position: relative;
    z-index: 10;
    padding: 0 1vw;
    font-size: clamp(4rem, 13vw, 16rem);
    gap: 0.5rem;
  }

  h1 {
    font-size: clamp(5rem, 17vw, 22rem);
    font-weight: 900;
    letter-spacing: 0.3rem;
    text-transform: uppercase;
    line-height: 1;
    text-align: center;
  }

  .letter {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 1.1em;
    height: 1.1em;
    cursor: pointer;
    user-select: none;
    background: transparent;
    border: none;
    border-radius: 0;
    padding: 0;
    color: #ffffff;
    text-shadow: 0 4px 18px rgba(0,0,0,0.45), 0 2px 6px rgba(0,0,0,0.35);
    transition: transform 0.3s cubic-bezier(0.23, 1, 0.32, 1), color 0.3s ease, text-shadow 0.3s ease;
    outline: none;
    animation: floatLetter 3.5s ease-in-out infinite;
  }

  .letter:hover {
    transform: translateY(-12px) scale(1.15) !important;
    color: #bae6fd;
    text-shadow: 0 6px 24px rgba(56,189,248,0.6), 0 2px 8px rgba(0,0,0,0.4);
  }

  .letter:focus-visible {
    outline: 2px solid #0369a1;
    outline-offset: 4px;
  }

  .letter span {
    display: block;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.25));
  }

  /* Staggered floating animation per letter */
  .letter:nth-child(1) { animation-delay: 0s; }
  .letter:nth-child(2) { animation-delay: 0.4s; }
  .letter:nth-child(3) { animation-delay: 0.8s; }
  .letter:nth-child(4) { animation-delay: 1.2s; }
  .letter:nth-child(5) { animation-delay: 1.6s; }
  .letter:nth-child(6) { animation-delay: 2.0s; }

  @keyframes floatLetter {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-18px); }
  }

  /* Poem card */
  #poem-box {
    max-width: 700px;
    width: 100%;
    padding: 2.5rem 2rem;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 28px;
    backdrop-filter: blur(20px);
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3);
    text-align: center;
    opacity: 0;
    transform: translateY(30px) scale(0.95);
    transition: opacity 0.5s ease, transform 0.5s ease;
    display: none;
    color: var(--text);
    position: relative;
    z-index: 10;
  }

  #poem-box.visible {
    display: block;
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  #poem-title {
    margin-bottom: 1.2rem;
    font-size: 1.6rem;
    font-weight: 700;
    color: #0369a1;
    letter-spacing: 0.05rem;
  }

  #poem-text {
    white-space: pre-line;
    line-height: 1.9;
    font-size: 1.15rem;
    color: var(--text-dim);
    margin-bottom: 1.8rem;
  }

  .hint {
    font-size: 0.9rem;
    color: #475569;
    font-style: italic;
    margin-bottom: 1.6rem;
  }

  .close {
    cursor: pointer;
    color: #0369a1;
    font-weight: 600;
    text-decoration: none;
    padding: 0.6rem 1.4rem;
    border: 1px solid #0369a1;
    border-radius: 12px;
    display: inline-block;
    transition: all 0.3s ease;
  }

  .close:hover {
    background: #0369a1;
    color: #ffffff;
    box-shadow: 0 0 20px rgba(3,105,161,0.3);
  }

  @media (max-width: 480px) {
    .word-wrapper {
      gap: 0.4rem;
    }
    .word-wrapper {
      font-size: clamp(3rem, 22vw, 8rem);
      gap: 0.4rem;
    }
    #poem-box {
      padding: 1.8rem 1.2rem;
      border-radius: 20px;
    }
  }
</style>
</head>
<body>

<!-- Rain -->
<div id="rain"></div>

<div class="word-wrapper">
  <span class="letter" data-letter="Y" role="button" tabindex="0"><span>Y</span></span>
  <span class="letter" data-letter="A" role="button" tabindex="0"><span>A</span></span>
  <span class="letter" data-letter="Ğ" role="button" tabindex="0"><span>Ğ</span></span>
  <span class="letter" data-letter="M" role="button" tabindex="0"><span>M</span></span>
  <span class="letter" data-letter="U" role="button" tabindex="0"><span>U</span></span>
  <span class="letter" data-letter="R" role="button" tabindex="0"><span>R</span></span>
</div>

<div id="poem-box">
  <h2 id="poem-title"></h2>
  <p id="poem-text"></p>
  <div class="hint" id="poem-hint"></div>
  <div class="close" id="close-poem">Kapa</div>
</div>

<script>
  const poems = {
    Y: {
      title: "Y ile başlayan şiir",
      text: "Yıldızlar kayar gecenin siyahında,\nYağmur düşer toprağa usulca,\nYollar uzanır sonsuza kadar,\nYürek sevgiyle dolup taşar."
    },
    A: {
      title: "A ile başlayan şiir",
      text: "Akşam kızılıyla boyanır gökyüzü,\nAğaçlar rüzgârla dansa kalkar,\nAşk bir nehir gibi akar içimde,\nAnılar hep yanımda kalır."
    },
    Ğ: {
      title: "Ğ ile başlayan şiir",
      text: "Türkçe alfabesinde Ğ ile başlayan kelime yoktur.\nAma yağmurla ilgili küçük bir şiir:\n\nGökyüzünden ince ince,\nYağmur damlaları düşer,\nToprağa can verir."
    },
    M: {
      title: "M ile başlayan şiir",
      text: "Masmavi bir gökyüzü altında,\nMutluluk hep yanımda yürür,\nMelekler gibi hafif bir rüzgâr,\nMutlu anlar biriktiririm."
    },
    U: {
      title: "U ile başlayan şiir",
      text: "Ufkun ötesinde bir deniz,\nUçan kuşlar özgürlüğün simgesi,\nUmudun ateşi hiç sönmez,\nUnutulmaz bir hayat yaşarız."
    },
    R: {
      title: "R ile başlayan şiir",
      text: "Rüzgâr eser sabahın serinliğinde,\nRüya gibi bir dünya kurarız,\nRenk renk çiçekler açar bahçede,\nRahmet yağar her yana."
    }
  };

  const letterEls = document.querySelectorAll(".letter");
  const poemBox = document.getElementById("poem-box");
  const poemTitle = document.getElementById("poem-title");
  const poemText = document.getElementById("poem-text");
  const poemHint = document.getElementById("poem-hint");
  const closeBtn = document.getElementById("close-poem");

  function showPoem(letter) {
    const p = poems[letter];
    poemTitle.textContent = p.title;
    poemText.textContent = p.text;
    poemHint.textContent = letter === "Ğ"
      ? "Türkçe alfabesinde Ğ ile başlayan kelime yoktur, bu yüzden yağmur temalı bir şiir gösterildi."
      : "Başka bir şiir görmek için farklı bir harfe tıklayın.";
    poemBox.classList.add("visible");
  }

  letterEls.forEach((el) => {
    el.addEventListener("click", () => showPoem(el.dataset.letter));
    el.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        showPoem(el.dataset.letter);
      }
    });
  });

  closeBtn.addEventListener("click", () => {
    poemBox.classList.remove("visible");
  });

  // Rain drops
  const rainContainer = document.getElementById("rain");
  const rainCount = 120;
  for (let i = 0; i < rainCount; i++) {
    const drop = document.createElement("div");
    drop.className = "drop";
    drop.style.left = Math.random() * 100 + "vw";
    drop.style.animationDuration = (Math.random() * 1.2 + 0.6) + "s";
    drop.style.animationDelay = Math.random() * 2 + "s";
    drop.style.opacity = Math.random() * 0.5 + 0.3;
    rainContainer.appendChild(drop);
  }

  // Daisy field removed - using real photo background
</script>

</body>
</html>
